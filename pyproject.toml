[project]
name = "devmultiagent"
version = "0.2.0"
description = "Multi-Agent Customer Service System - Vertical Slice MVP"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.0,<4",
    "openai>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "pytest>=8.0.0",
]

[project.scripts]
devma = "devma.main:app"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["devma*"]

[tool.pytest.ini_options]
markers = ["live: opt-in tests that call the paid model API"]
