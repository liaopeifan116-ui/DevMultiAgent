[project]
name = "devmultiagent"
version = "0.1.0"
description = "Multi-Agent Customer Service System - Vertical Slice MVP"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.4.0",
    "langgraph-checkpoint>=2.0.0",
    "openai>=1.0.0",
    "chromadb>=0.5.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "pytest>=8.0.0",
]

[project.scripts]
devma = "devma.main:app"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["devma*"]
